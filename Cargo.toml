[package]
name = "cairn"
version = "1.1.2"
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"
publish = false

[lib]
name = "cairn"
path = "src/lib/lib.rs"

[[bin]]
name = "cairn"
path = "src/bin/cairn.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
# Shared UI with zwipe.net, zite, the portfolio and zwiper (Button, Chip,
# ActionBar, the theme palettes, and the app kit: BottomSheet, PageHeader,
# ThemeSheet, the hint pieces, the overlay back stack and the OS back
# gesture; `toast` adds ToastStack). Cargo.lock pins the exact commit;
# `cargo update -p orangui` pulls the latest deliberately.
orangui = { git = "https://github.com/scadoshi/orangui", features = ["toast"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Local store. `bundled` compiles SQLite in so the desktop, iOS, and (later)
# watch builds carry the same engine and need nothing from the OS.
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
# Per-platform data and download directories for the database and CSV exports.
dirs = "6"
# `use_toast`, the same pinned build zwiper and orangui's ToastStack use.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false }
# Timers for the entrances; dioxus-desktop already brings the runtime in.
tokio = { version = "1", features = ["time"] }

# UIApplication's alternate icon calls, for the App icon sheet. The same
# versions tao already brings in.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
block2 = "0.6"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# Library crates flip this to "warn": builders and pure functions get #[must_use].
must_use_candidate = "allow"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"

# tao from zwipe's vendored copy (tao 0.37.0 labeled 0.34.9, with the iOS
# event loop running mid-scroll). Cargo.lock pins the zwipe commit;
# `cargo update -p tao` moves it. Its UIScene support is what lets the app
# launch on iOS 27; see zwipe/vendor/tao/VENDOR.md.
[patch.crates-io]
tao = { git = "https://github.com/scadoshi/zwipe" }
