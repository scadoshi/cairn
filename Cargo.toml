[package]
name = "cairn"
version = "0.1.0"
authors = ["Scotty Fermo <scottyfermo@hotmail.com>"]
edition = "2024"
publish = false

[lib]
name = "cairn"
path = "src/lib/lib.rs"

[[bin]]
name = "cairn"
path = "src/bin/cairn.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
# Shared UI with zwipe.net, zite, the portfolio and zwiper (Button, Chip,
# ActionBar, the theme palettes, and the app kit: BottomSheet, PageHeader,
# ThemeSheet, the hint pieces, the overlay back stack; `toast` adds
# ToastStack). Cargo.lock pins the exact commit;
# `cargo update -p zwipe-components` pulls the latest deliberately.
zwipe-components = { git = "https://github.com/scadoshi/zwipe", rev = "0c079531268fcbe1665064ea0d3454232a352b57", features = ["toast"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Local store. `bundled` compiles SQLite in so the desktop, iOS, and (later)
# watch builds carry the same engine and need nothing from the OS.
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
# Per-platform data and download directories for the database and CSV exports.
dirs = "6"
# `use_toast`, the same pinned build zwiper and zwipe-components' ToastStack use.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false }
# Timers for the entrances and the back handler's channel; dioxus-desktop
# already brings the runtime in.
tokio = { version = "1", features = ["time", "sync"] }

# iOS: the left-edge back swipe is a UIKit gesture recognizer attached to the
# WKWebView (components/navigation/back_handler.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# Android: finishing the Activity from a root screen goes through JNI.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# flags prose like "SQLite" and "Dioxus" as unbackticked identifiers
doc_markdown = "allow"
# never ship
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
# no panics in non-test code (clippy.toml allows them inside tests)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# tao from zwipe's vendored copy (tao 0.37.0 labeled 0.34.9, with the iOS
# event loop running mid-scroll), locked to the same zwipe commit as
# zwipe-components. Its UIScene support is what lets the app launch on iOS 27;
# see zwipe/vendor/tao/VENDOR.md.
[patch.crates-io]
tao = { git = "https://github.com/scadoshi/zwipe" }
