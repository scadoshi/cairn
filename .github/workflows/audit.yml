name: Security audit

# Scans Cargo.lock against the RustSec Advisory DB. Fails, which emails the
# repo owner, when a dependency has a known vulnerability. Weekly to catch
# newly published advisories against pinned deps, and on any lockfile or
# manifest change to catch a vulnerable dep the moment it arrives.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
