name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS, not Linux: cairn ships to macOS and iOS, and its default feature
    # pulls dioxus-desktop, which would need a pile of webkit2gtk system
    # packages on a Linux runner. Public repo, so macOS minutes are free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  # Format with nightly (rustfmt.toml uses an unstable option), lint with stable.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Broken intra-doc links and other rustdoc warnings fail the way clippy's do.
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # `dx check` catches the one class of bug neither clippy nor the tests see:
  # a hook called conditionally, in a loop, or outside a component body.
  # Dioxus panics at runtime when the hook count changes between renders,
  # which takes the whole screen down. Its own job so a CLI install that
  # fails or drifts cannot mask a real lint or test failure.
  hooks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dx comes from the cache on most runs, so a GitHub release download
      # that fails cannot fail the gate. On a miss it installs with
      # cargo-binstall, and builds from crates.io if that fails too.
      - name: Restore the Dioxus CLI
        id: dx-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dx-0.7.10-${{ runner.os }}-${{ runner.arch }}
      # Pinned, both the action and the binary it downloads, so a new
      # release cannot change or break the install on its own.
      - uses: cargo-bins/cargo-binstall@v1.26.1
        if: steps.dx-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          version: 1.26.1
      # Pinned: dx is the same tool version used locally, and an 0.8 alpha
      # arriving on its own would change what this gate means.
      - name: Install the Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm --locked \
            || cargo install dioxus-cli@0.7.10 --locked
      - name: Hook order
        run: dx check
