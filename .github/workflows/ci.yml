name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS, not Linux: cairn ships to macOS and iOS, and its default feature
    # pulls dioxus-desktop, which would need a pile of webkit2gtk system
    # packages on a Linux runner. Public repo, so macOS minutes are free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  # Format with nightly (rustfmt.toml uses an unstable option), lint with stable.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
