[application]
name = "Count"

[bundle]
identifier = "com.scadoshi.count"
publisher = "scadoshi"
# The "o" from the wordmark, rendered by scripts/icon.py from assets/c.txt.
icon = ["assets/favicon/icon-1024.png"]

[web.app]
title = "Count"

[ios.plist]
CFBundlePackageType = "APPL"
# dx derives the bundle name from the crate (Crow). These override it for the
# home-screen label; the plist ends up with both keys twice and the last one
# wins. operations/ios/submission.md dedupes it with plutil before signing.
CFBundleDisplayName = "Count"
CFBundleName = "Count"
MinimumOSVersion = "16.0"
# CSV exports go to the app's Documents folder; these two keys make the Files
# app show it under "On My iPhone > Count" so the files can be opened or shared.
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
# Apple's submission allowlist requires a binary linked against the current
# Xcode and SDK, and Dioxus writes these from a stale template. Keep them at
# whatever `xcodebuild -version` and `xcrun --sdk iphoneos --show-sdk-version`
# say on the build machine; operations/ios/submission.md re-patches them at
# release time anyway.
DTPlatformName = "iphoneos"
DTPlatformVersion = "27.0"
DTSDKName = "iphoneos27.0"
DTXcode = "2700"
DTXcodeBuild = "27A266a"
DTCompiler = "com.apple.compilers.llvm.clang.1_0"
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationPortrait"]
